<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Amt Buddy Chatbot - Geführter Assistent für Berliner Adressprüfung, Mietspiegel 2026 und Belegungsprüfung (§ 7 WoAufG Bln)."
    />
    <title>Amt Buddy · Geführter Chatbot (Vollbild)</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="fullscreen-chat-body">
    <div class="chat-app-layout">
      <!-- Fullscreen Top Bar -->
      <header class="chat-app-header">
        <div class="chat-header-brand">
          <span class="status-dot live" aria-hidden="true"></span>
          <div class="chat-title-wrap">
            <h1 class="chat-main-title">Amt-Buddy Chatbot</h1>
            <span class="chat-subtitle">Geführter Modus · Berliner Liegenschaftskataster &amp; Mietspiegel 2026</span>
          </div>
        </div>
        <div class="chat-header-actions">
          <button type="button" id="btn-reset-chat" class="header-action-btn" title="Chat neu starten">
            🔄 Neu starten
          </button>
          <a href="/" class="header-action-btn back-link">
            ← Zur Formularansicht
          </a>
        </div>
      </header>

      <!-- Chat Stream Container (Takes full viewport height) -->
      <main class="chat-stream-container">
        <div class="chat-stream-inner">
          <div id="chat-stream" class="chat-stream" role="log" aria-live="polite">
            <!-- Dynamic chat bubbles inserted here -->
          </div>
        </div>
      </main>

      <!-- Bottom Pinned Action Bar & Input -->
      <footer class="chat-app-footer">
        <div class="chat-footer-inner">
          <div id="quick-options" class="quick-options" aria-label="Schnelloptionen">
            <!-- Guided decision buttons -->
          </div>

          <form id="chat-input-form" class="chat-input-bar">
            <input
              type="file"
              id="chat-file-input"
              accept=".pdf,.txt,.md,.json"
              style="display:none;"
            />
            <button
              type="button"
              id="chat-upload-btn"
              class="chat-bar-btn upload"
              title="Mietvertrag oder Dokument anhängen (PDF/Text für OCR)"
              aria-label="Dokument anhängen"
            >
              📎
            </button>
            <input
              type="text"
              id="chat-user-input"
              class="chat-bar-input"
              placeholder="Antwort eingeben, Adresse tippen oder Option wählen …"
              autocomplete="off"
              required
            />
            <button type="submit" id="chat-send-btn" class="chat-bar-btn send">
              Senden <span aria-hidden="true">→</span>
            </button>
          </form>
        </div>
      </footer>
    </div>

    <script type="module" src="/chatbot.js"></script>
  </body>
</html>
